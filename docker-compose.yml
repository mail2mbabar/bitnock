services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bitnock
      POSTGRES_USER: bitnock
      POSTGRES_PASSWORD: bitnock
    ports:
      - "5432:5432"
    volumes:
      - bitnock-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitnock"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Blog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Port=5432;Database=bitnock;Username=bitnock;Password=bitnock
      Jwt__SigningKey: DEV-ONLY-CHANGE-ME-bitnock-jwt-signing-key-32+
      Site__Name: Bitnock
      Site__Url: http://localhost:3000
      Storage__PublicBaseUrl: http://localhost:3000/media
      Cors__AllowedOrigins__0: http://localhost:3000
      Seed__Enabled: "true"
    ports:
      - "5080:8080"
    volumes:
      - bitnock-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  bitnock-db:
  bitnock-storage:
